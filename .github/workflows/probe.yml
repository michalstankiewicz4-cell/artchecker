name: Rozpoznanie źródeł (probe)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe.sh > tools/probe-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/probe-out.txt && git commit -m "Wynik rozpoznania źródeł" && git push
