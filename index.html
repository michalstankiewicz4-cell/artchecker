<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pracownia ekspertyz – znajdź oryginał</title>
<style>
:root{--bg:#12100e;--panel:#1d1916;--line:#3a322b;--ink:#ece3d4;--mut:#a39580;--acc:#d8a64c;--bad:#e0584f;--ok:#76b86f;--sus:#f0a030}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font:600 18px Georgia,serif;margin:0;color:var(--acc)}
.case{color:var(--mut);font-size:12.5px;flex:1 1 400px}
select{background:#2a231d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
main{display:grid;grid-template-columns:215px minmax(0,1fr) 370px;gap:10px;padding:10px;height:calc(100vh - 52px)}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}#boardwrap{height:62vh!important;flex:none!important}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;min-height:0}
.grp h3{font:600 11px system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:12px 0 5px}
.grp:first-child h3{margin-top:0}
.tool{display:block;width:100%;text-align:left;background:#28221d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin:3px 0;cursor:pointer;font-size:13px}
.tool:hover{border-color:var(--acc)}
.tool.on{background:#3d301c;border-color:var(--acc)}
.tool.used::after{content:" ✓";color:var(--acc)}
#center{display:flex;flex-direction:column;gap:8px;min-height:0}
#boardwrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0d0b0a}
#board,#three{position:absolute;inset:0;width:100%;height:100%}
#board{display:block;touch-action:none;cursor:grab}
#board.drag{cursor:grabbing}
#board.probe{cursor:crosshair}
#three{display:none;touch-action:none}
#three canvas{display:block;width:100%!important;height:100%!important}
.zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.zoom button,.btn{background:#2a231d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
.zoom button:hover,.btn:hover{border-color:var(--acc)}
#zlv{background:rgba(0,0,0,.65);padding:4px 7px;border-radius:5px;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.viewlbl{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);padding:4px 9px;border-radius:5px;font-size:12px;color:var(--acc);max-width:45%}
.help{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:5px;font-size:11px;color:var(--mut)}
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#3d301c;border:1px solid var(--acc);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.primary{background:#5a431c;border-color:var(--acc);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.m-susp{border-color:var(--sus)}.btn.m-excl{border-color:var(--bad)}
#sel{color:var(--mut)}
#panel h2{font:600 15px Georgia,serif;margin:0 0 4px;color:var(--acc)}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 8px;border-left:2px solid var(--line);padding-left:8px}
.gate{font-size:12px;margin:4px 0 8px;padding:5px 8px;border-radius:6px;background:#221d18;border:1px dashed var(--line)}
.gate.ok{border-color:var(--ok);color:#cfe8c9}.gate.no{border-color:var(--sus)}
.obs{background:#26201b;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:6px 0;font-size:13px}
#panel canvas,#panel img{width:100%;height:auto;display:block;border-radius:4px;border:1px solid var(--line);margin:4px 0}
.cap{font-size:11.5px;color:var(--mut);margin:2px 0 8px}
table.pig{width:100%;border-collapse:collapse;font-size:12.5px}
table.pig td,table.pig th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.doc{background:#efe6d0;color:#2b241b;border-radius:4px;padding:12px 14px;font:13px/1.5 Georgia,serif}
.doc h4{margin:0 0 6px;text-align:center;letter-spacing:.05em;font-size:13px}
.doc .row{display:flex;gap:6px}.doc .row b{min-width:112px;display:inline-block}
.doc .stamp{margin-top:8px;font-style:italic}
.doc ul{margin:4px 0;padding-left:18px}.doc li{margin:3px 0}
.tl{list-style:none;padding:0;margin:0;font-size:13px}
.tl li{padding:4px 0 4px 10px;border-left:2px solid var(--acc);margin-left:4px}
.tl li b{color:var(--acc)}
#notes{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
#notes h3{font:600 12px system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 6px}
#notes ul{padding-left:16px;margin:0;font-size:12.5px}
#notes li{margin:3px 0}
#notes li span{color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--acc);border-radius:10px;max-width:1040px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.box h2{font:600 20px Georgia,serif;margin:0 0 8px}
table.mx{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}
table.mx th,table.mx td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.mx td:first-child,table.mx th:first-child{text-align:left}
.x{color:var(--bad);font-weight:700}.v{color:var(--ok)}
.cp{margin:8px 0;font-size:13px}.cp b{color:var(--acc)}
.cp ul{margin:3px 0 0;padding-left:18px}
small.nb{color:var(--mut)}
#check{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
#check h3{font:600 12px system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 6px}
#check label{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:3px 4px;border-radius:5px;cursor:pointer}
#check label:hover{background:#26201b}#check label.on{color:#ffb3ad}
#check input{accent-color:#e0584f;margin-top:2px}
#check .cnt{font-size:12px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Pracownia ekspertyz</h1>
  <select id="mode">
    <option value="paint5">Znajdź oryginał – obrazy</option>
    <option value="frag">Zniszczony fragment – czy to oryginał?</option>
    <option value="sculpt">Znajdź oryginał – rzeźby 3D</option>
    <option value="memory">Pamięć eksperta – zapamiętaj oryginał</option>
    <option value="notes">Weryfikacja banknotów</option>
  </select>
  <select id="artist"></select>
  <button class="btn" id="newgame">Nowa partia</button>
  <div class="case" id="case"></div>
</header>
<main>
  <div class="col" id="tools"></div>
  <div id="center">
    <div id="boardwrap">
      <canvas id="board"></canvas>
      <div id="three"></div>
      <div class="viewlbl" id="viewlbl"></div>
      <div class="zoom">
        <button id="zout" title="Oddal">−</button><span id="zlv">×1</span><button id="zin" title="Przybliż">+</button>
        <label id="tiltw" style="display:none;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;font-size:12px">Nachylenie <input type="range" id="tilt" min="0" max="90" value="0" style="vertical-align:middle;width:110px"> <span id="tiltv">0°</span></label><button id="zfit">Całość</button><button id="zsel">Wybrany</button><button id="zsig">Sygnatura</button>
      </div>
      <div class="help" id="help"></div>
      <div id="toast"></div>
    </div>
    <div id="bar">
      <span id="sel">Nie wybrano obiektu.</span>
      <span id="markbtns">
        <button class="btn m-susp" data-mark="susp">? Podejrzany</button>
        <button class="btn m-excl" data-mark="excl">✕ Wykluczony</button>
        <button class="btn" data-mark="ok" id="markok" style="border-color:var(--ok);display:none">✓ Prawdziwy</button>
        <button class="btn" data-mark="">Bez oznaczenia</button>
      </span>
      <span id="verdicts"></span>
    </div>
  </div>
  <div class="col" id="right"><div id="panel"></div><div id="check"></div><div id="notes"></div></div>
</main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
"use strict";
/* =====================================================================
   NARZĘDZIA OGÓLNE
   ===================================================================== */
const S=2;let W=640,H=480,IW=W*S,IH=H*S,G=110,BW=1,BH=1;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(a,r)=>a[Math.floor(r()*a.length)];
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const range=(a,b,s)=>{const o=[];for(let i=a;i<=b+1e-9;i+=s)o.push(i);return o};
const lin=(x0,y0,x1,y1,st)=>x=>{const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
const rad=(cx,cy,r0,r1,st)=>x=>{const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
const quad=(t,a,b,c)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
const fmt=n=>String(n).replace('.',',');
const h1=(i,s)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v)};
function inPoly(x,y,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;let t=((px-a[0])*dx+(py-a[1])*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function distPath(px,py,pts){let m=1e9;for(let i=1;i<pts.length;i++)m=Math.min(m,distSeg(px,py,pts[i-1],pts[i]));return m}
let toastT=0;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}

/* =====================================================================
   PIGMENTY
   ===================================================================== */
const PG={ultr:['Ultramaryna syntetyczna',1828,'Na, Al, Si, S'],pb:['Biel ołowiowa',0,'Pb'],prus:['Błękit pruski',1706,'Fe, K'],vir:['Zieleń szmaragdowa (wiridian)',1838,'Cr'],
 ochy:['Ochra żółta',0,'Fe'],sien:['Siena palona',0,'Fe, Mn'],umb:['Umbra palona',0,'Fe, Mn'],cyn:['Cynober',0,'Hg, S'],ochr:['Ochra czerwona',0,'Fe'],bone:['Czerń kostna',0,'Ca, P'],
 cob:['Błękit kobaltowy',1802,'Co, Al'],cadY:['Żółcień kadmowa',1840,'Cd, S'],lake:['Laka karminowa',0,'Al, Ca (organiczny)'],naples:['Żółcień neapolitańska',0,'Pb, Sb'],au:['Złoto płatkowe',0,'Au'],
 tiw:['Biel tytanowa',1921,'Ti'],phB:['Błękit ftalocyjaninowy',1935,'Cu, Cl'],phG:['Zieleń ftalocyjaninowa',1938,'Cu, Cl'],quin:['Czerwień chinakrydonowa',1958,'C, N, O (organiczny)'],
 hansa:['Żółcień arylidowa (Hansa)',1910,'C, N, O (organiczny)'],diox:['Fiolet dioksazynowy',1952,'C, N, O, Cl (organiczny)'],
 zn:['Biel cynkowa',1834,'Zn'],schw:['Zieleń szwajnfurcka',1814,'Cu, As'],minium:['Minia',0,'Pb'],chromY:['Żółcień chromowa',1809,'Pb, Cr'],
 chalk:['Grunt kredowo-klejowy (biały)',0,'Ca'],greyOil:['Grunt olejny szary (biel ołowiowa + czerń)',0,'Pb, Ca, P'],redBole:['Grunt czerwony (bolus)',0,'Fe, Al, Si'],gessoA:['Grunt akrylowy z bielą tytanową',1955,'Ti, C']};
const ALT={ultr:'cob',prus:'cob',cob:'ultr',vir:'schw',pb:'zn',cyn:'minium',ochy:'chromY',naples:'chromY',lake:'cyn',umb:'sien',sien:'umb',ochr:'minium',bone:'umb',cadY:'chromY',au:'ochy'};
const XW={pb:.92,naples:.85,cyn:.78,minium:.88,chromY:.8,zn:.55,tiw:.6,au:.97,greyOil:.8,chalk:.35};
const GROUND_COL={chalk:'#ece4d0',greyOil:'#8f8a82',redBole:'#9a4a2c',gessoA:'#f6f6f3'};
const yr=k=>PG[k][1]?String(PG[k][1]):'starożytności';

/* =====================================================================
   ARTYŚCI (fikcyjni)
   ===================================================================== */
const ARTISTS=[
 {id:'wierz',name:'Antoni Wierzbicki',life:'1838–1901',scene:'pejzaz',title:'Pejzaż z jeziorem i postacią',year:1872,wcm:64.5,hcm:48,crn:214,ref:'„Droga do wsi”, 1869 (kat. rais. nr 198)',
  sig:{text:'A. Wierzbicki 1872',corner:'br',color:'#2a1d14',pig:'bone',font:'italic 14px Georgia,"Times New Roman",serif',slant:-0.4}},
 {id:'brzo',name:'Helena Brzostowska',life:'1851–1919',scene:'portret',title:'Portret kobiety w ciemnej sukni',year:1889,wcm:48,hcm:60,crn:87,ref:'„Portret siostry artystki”, 1886 (kat. rais. nr 61)',
  sig:{text:'H. Brzostowska 89',corner:'bl',color:'#8a2e1e',pig:'cyn',font:'italic 600 14px "Times New Roman",Georgia,serif',slant:-0.22}},
 {id:'mora',name:'Feliks Moraczewski',life:'1829–1897',scene:'martwa',title:'Martwa natura z dzbanem i owocami',year:1864,wcm:64,hcm:48,crn:132,ref:'„Martwa natura z cytrynami”, 1862 (kat. rais. nr 117)',
  sig:{text:'F. MORACZEWSKI 1864',corner:'br',color:'#2a1d14',pig:'bone',font:'12px Georgia,serif',slant:-0.08}},
 {id:'lind',name:'Józef Lindorf',life:'1846–1912',scene:'marina',title:'Żaglowiec u skalistego brzegu',year:1881,wcm:68,hcm:44,crn:305,ref:'„Przed burzą”, 1879 (kat. rais. nr 288)',
  sig:{text:'J. Lindorf 1881',corner:'br',color:'#e6dcc4',pig:'pb',font:'italic 15px Palatino,Georgia,serif',slant:-0.5}},
];

/* =====================================================================
   KSZTAŁTY SCEN
   ===================================================================== */
const Sr=(reg,x,y,w,h,fill,o={})=>({t:'rect',reg,x,y,w,h,fill,...o});
const Se=(reg,cx,cy,rx,ry,fill,o={})=>({t:'ell',reg,cx,cy,rx,ry,rot:0,fill,...o});
const Sp=(reg,pts,fill,o={})=>({t:'poly',reg,pts,fill,...o});
const Sl=(pts,stroke,lw,o={})=>({t:'line',pts,stroke,lw,noHit:true,...o});
const Sd=fn=>({t:'deco',fn,noHit:true});
function pathShape(x,s){x.beginPath();if(s.t==='rect')x.rect(s.x,s.y,s.w,s.h);else if(s.t==='ell')x.ellipse(s.cx,s.cy,s.rx,s.ry,s.rot,0,Math.PI*2);else{s.pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(s.t==='poly')x.closePath()}}
function drawShapes(x,L,r){for(const s of L){if(s.hidden)continue;if(s.t==='deco'){s.fn(x,r);continue}pathShape(x,s);
 if(s.t==='line'){x.strokeStyle=s.stroke;x.lineWidth=s.lw;x.lineCap='round';x.lineJoin='round';x.stroke();continue}
 x.fillStyle=typeof s.fill==='function'?s.fill(x):s.fill;x.fill()}}
function hitShape(s,x,y){if(s.t==='rect')return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h;
 if(s.t==='ell'){const dx=(x-s.cx)/s.rx,dy=(y-s.cy)/s.ry;return dx*dx+dy*dy<=1}
 if(s.t==='poly')return inPoly(x,y,s.pts);return false}
function contour(s){if(s.t==='rect')return[[s.x,s.y],[s.x+s.w,s.y],[s.x+s.w,s.y+s.h],[s.x,s.y+s.h]];
 if(s.t==='ell'){const a=[];for(let i=0;i<22;i++){const t=i/22*6.283;a.push([s.cx+Math.cos(t)*s.rx,s.cy+Math.sin(t)*s.ry])}return a}return s.pts}

/* ---------------- PEJZAŻ ---------------- */
function foliage(x,t,r){const cy=t.y-t.s*1.7,cols=['#2c4521','#34522a','#3e5d2c','#4a6a33'];
 for(let i=0;i<10;i++){const a=r()*6.28,d=r()*0.55;x.fillStyle=pick(cols,r);x.beginPath();x.arc(t.x+Math.cos(a)*t.s*d,cy+Math.sin(a)*t.s*d*0.8,t.s*(0.42+r()*0.2),0,7);x.fill()}
 for(let i=0;i<6;i++){x.fillStyle='rgba(135,160,85,.55)';x.beginPath();x.arc(t.x-t.s*(0.2+r()*0.4),cy-t.s*(0.1+r()*0.4),t.s*(0.12+r()*0.12),0,7);x.fill()}}
function clouds(r,n,y0,y1){const a=[];for(let k=0;k<n;k++){const cx=W*(0.28+r()*0.66),cy=H*(y0+r()*(y1-y0)),sz=24+r()*26;for(let i=0;i<5;i++)a.push({x:cx+(r()-.5)*sz*2.2,y:cy+(r()-.5)*sz*0.4,rx:sz*(0.5+r()*0.5),ry:sz*(0.24+r()*0.18)})}return a}
const SCENES={};
SCENES.pejzaz={W:640,H:480,bg:'grunt',
 REG:{niebo:{pig:['ultr','pb'],dir:'h',an:'phB'},chmury:{pig:['pb','ochy'],dir:'swirl',an:'tiw'},'góry':{pig:['ultr','pb','ochy'],dir:'h'},grunt:{pig:['ochy','sien','umb'],dir:'diag',an:'hansa'},
  droga:{pig:['ochy','pb'],dir:'diag'},woda:{pig:['prus','pb'],dir:'h',an:'phB'},dom:{pig:['pb','ochr'],dir:'hv',an:'tiw'},dach:{pig:['ochr','umb'],dir:'hv'},'pień':{pig:['umb'],dir:'v'},
  listowie:{pig:['vir','ochy'],dir:'dab',an:'phG'},'postać':{pig:['cyn','pb'],dir:'v',an:'quin'},karnacja:{pig:['pb','ochr','cyn'],dir:'dab'}},
 make(r){const c={ph:r()*6};c.hz=H*(0.42+r()*0.07);
  c.sun={x:W*(0.08+r()*0.1),y:H*(0.08+r()*0.06)};c.clouds=clouds(r,3+Math.floor(r()*2),0.07,0.27);
  c.lake={x:W*(0.2+r()*0.18),y:c.hz+26,rx:115+r()*35,ry:15+r()*6};c.house={x:W*(0.66+r()*0.06),y:c.hz+20,w:64,h:42};c.fig={x:W*(0.44+r()*0.12),y:H*0.86,h:74};
  c.trees=[];for(let i=0;i<4;i++){let x=W*(0.06+(i/4)*0.9+r()*0.06);if(Math.abs(x-c.fig.x)<60)x+=70;if(x>c.house.x-30&&x<c.house.x+100)x=c.house.x-40-r()*20;c.trees.push({x,y:c.hz+48+r()*60,s:22+r()*14})}
  c.trees.sort((a,b)=>a.y-b.y);return c},
 hill:(c,x)=>c.hz-22-14*Math.sin(x*0.012+c.ph)-7*Math.sin(x*0.029+c.ph*2),
 near:(c,x)=>c.hz-6-5*Math.sin(x*0.021+c.ph*3),
 build(c,err){const L=[],an=err==='anatomy',sw=err==='shadow',sc=SCENES.pejzaz;
  L.push(Sr('niebo',0,0,W,c.hz+4,lin(0,0,0,c.hz,[[0,'#58799d'],[.7,'#a7bacb'],[1,'#e2d5b6']])));
  L.push(Sd(x=>{x.fillStyle=rad(c.sun.x,c.sun.y,4,170,[[0,'rgba(255,245,212,.95)'],[1,'rgba(255,245,212,0)']])(x);x.fillRect(0,0,W,c.hz)}));

const MEM={phase:0,left:0,iv:0,lens:null,reveal:false,base:null,seed:0};
function bboxOf(s){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;contour(s).forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});return[x0,y0,x1,y1]}
function cloneShape(s){const o={...s};if(s.pts)o.pts=s.pts.map(q=>q.slice());return o}
function xform(s,fn){if(s.t==='rect'){const a=fn([s.x,s.y]),b=fn([s.x+s.w,s.y+s.h]);s.x=Math.min(a[0],b[0]);s.y=Math.min(a[1],b[1]);s.w=Math.abs(b[0]-a[0]);s.h=Math.abs(b[1]-a[1])}
 else if(s.t==='ell'){const c=fn([s.cx,s.cy]),e=fn([s.cx+s.rx,s.cy+s.ry]);s.cx=c[0];s.cy=c[1];s.rx=Math.abs(e[0]-c[0]);s.ry=Math.abs(e[1]-c[1])}else s.pts=s.pts.map(fn)}
function genMut(r,L,used){const cands=L.map((s,i)=>({s,i})).filter(({s,i})=>['rect','ell','poly'].includes(s.t)&&!s.hidden&&!s.noHit&&s.reg&&!used.has(i)).filter(({s})=>{const b=bboxOf(s),a=(b[2]-b[0])*(b[3]-b[1]);return a>15&&a<12000&&b[0]>-1&&b[2]<W+1&&b[1]>-1&&b[3]<H+1});
 const type=pick(['shift','shift','scale','remove','tint','extra','sig'],r),cm=pxPerCm();
 if(type==='sig'){const txt=ART.sig.text.replace(/(\d)(?!.*\d)/,d=>String((+d+1)%10));return{type,txt,box:[C.sig.x,C.sig.y-16,C.sig.x+C.sig.w,C.sig.y+6],desc:`inna ostatnia cyfra w sygnaturze („${txt}”)`}}
 if(type==='extra'){const sky=!!SC.REG.niebo,bx=40+r()*(W-80),by=sky?18+r()*H*0.22:40+r()*(H-80);return{type,sky,bx,by,box:[bx-7,by-5,bx+7,by+5],desc:sky?'dodatkowy, maleńki ptak na niebie':'dodatkowa drobna plamka farby'}}
 const c=pick(cands,r);used.add(c.i);const b0=bboxOf(c.s);
 if(type==='shift'){const dx=(r()<.5?-1:1)*(4+r()*5),dy=r()<.5?0:(r()<.5?-1:1)*(2+r()*3);return{type,i:c.i,dx,dy,box:[b0[0]+Math.min(0,dx),b0[1]+Math.min(0,dy),b0[2]+Math.max(0,dx),b0[3]+Math.max(0,dy)],desc:`przesunięty element (${c.s.reg}) o ok. ${fmt((Math.hypot(dx,dy)/cm).toFixed(1))} cm`}}
 if(type==='scale'){const k=r()<.5?0.82:1.2,cx=(b0[0]+b0[2])/2,cy=(b0[1]+b0[3])/2,e=Math.max(1,k);return{type,i:c.i,k,cx,cy,box:[cx-(cx-b0[0])*e,cy-(cy-b0[1])*e,cx+(b0[2]-cx)*e,cy+(b0[3]-cy)*e],desc:`element (${c.s.reg}) ${k>1?'powiększony':'pomniejszony'} o ok. ${Math.round(Math.abs(k-1)*100)}%`}}
 if(type==='remove')return{type,i:c.i,box:b0,desc:`brak elementu (${c.s.reg})`};
 const col=pick(['rgba(190,40,30,.38)','rgba(40,80,190,.38)','rgba(230,200,40,.4)','rgba(40,140,60,.38)'],r);return{type:'tint',i:c.i,col,box:b0,desc:`zmieniony odcień elementu (${c.s.reg})`}}
function applyMuts(L0,muts,p){const L=L0.map(cloneShape),add=[];
 for(const m of muts){const s=L[m.i];if(m.type==='shift')xform(s,q=>[q[0]+m.dx,q[1]+m.dy]);else if(m.type==='scale')xform(s,q=>[m.cx+(q[0]-m.cx)*m.k,m.cy+(q[1]-m.cy)*m.k]);
  else if(m.type==='remove'){s.hidden=true;s.noHit=true}else if(m.type==='tint')add.push({...cloneShape(s),fill:m.col,noHit:true});
  else if(m.type==='extra')add.push(m.sky?Sl([[m.bx-5,m.by-2],[m.bx,m.by+1],[m.bx+5,m.by-2]],'#3a3530',1.2):Se(null,m.bx,m.by,2.4,2,'rgba(40,30,20,.85)',{noHit:true}));
  else if(m.type==='sig')p.sigText=m.txt}return L.concat(add)}

function memPhase2(r){clearInterval(MEM.iv);if(MEM.phase!==1)return;MEM.phase=2;const o=P[0],base=o.shapes,list=[o];
 for(let k=0;k<4;k++){const p={orig:false,profile:null,t:{},seed:MEM.seed,letter:''};basePainting(p,r);p.seed=MEM.seed;const used=new Set(),n=r()<0.4?2:1;p.muts=[];for(let j=0;j<n;j++)p.muts.push(genMut(r,base,used));

document.getElementById('zin').onclick=()=>{if(MODE==='sculpt')return zoom3(1/1.4);const r=cv.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.6)};
document.getElementById('zout').onclick=()=>{if(MODE==='sculpt')return zoom3(1.4);const r=cv.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.6)};

document.getElementById('zsel').onclick=()=>{if(!sel)return;if(MODE==='sculpt'){const b=T3.busts.find(b=>b.q===sel);anim3(b.center.clone(),0.9,0,0.1);return}focusRect(sel.x-40,sel.y-40,W+80,H+80)};
document.getElementById('zsig').onclick=()=>{if(!sel)return;if(MODE==='sculpt'){const b=T3.busts.find(b=>b.q===sel);anim3(new THREE.Vector3(b.center.x,1.05,0),0.4,Math.PI,0.15);return}if(sel.note)return focusRect(sel.x+598,sel.y+26,100,22);focusRect(sel.x+C.sig.x-14,sel.y+C.sig.y-26,C.sig.w+28,40)};
