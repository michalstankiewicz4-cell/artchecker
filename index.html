<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pracownia ekspertyz – znajdź oryginał</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Pracownia ekspertyz <small id="appver" style="font:12px system-ui;color:var(--mut)"></small></h1>
  <select id="mode"></select>
  <select id="artist"></select>
  <button class="btn" id="newgame">Nowa partia</button>
  <div class="case" id="case"></div>
</header>
<main>
  <div class="col" id="tools"></div>
  <div id="center">
    <div id="boardwrap">
      <canvas id="board"></canvas>
      <div id="three"></div>
      <div class="viewlbl" id="viewlbl"></div>
      <div class="zoom">
        <button id="zout" title="Oddal">−</button><span id="zlv">×1</span><button id="zin" title="Przybliż">+</button>
        <label id="tiltw" style="display:none;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;font-size:12px">Nachylenie <input type="range" id="tilt" min="0" max="90" value="0" style="vertical-align:middle;width:110px"> <span id="tiltv">0°</span></label><button id="zfit">Całość</button><button id="zsel">Wybrany</button><button id="zsig">Sygnatura</button>
      </div>
      <div class="help" id="help"></div>
      <div id="toast"></div>
    </div>
    <div id="bar">
      <span id="sel">Nie wybrano obiektu.</span>
      <span id="markbtns">
        <button class="btn m-susp" data-mark="susp">? Podejrzany</button>
        <button class="btn m-excl" data-mark="excl">✕ Wykluczony</button>
        <button class="btn" data-mark="ok" id="markok" style="border-color:var(--ok);display:none">✓ Prawdziwy</button>
        <button class="btn" data-mark="">Bez oznaczenia</button>
      </span>
      <span id="verdicts"></span>
    </div>
  </div>
  <div class="col" id="right"><div id="panel"></div><div id="check"></div><div id="notes"></div></div>
</main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script src="js/version.js"></script>
<script src="js/core/util.js"></script>
<script src="js/data/pigments.js"></script>
<script src="js/data/artists.js"></script>
<script src="js/paint/scenes.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/kinds.js"></script>
<script src="js/paint/painting.js"></script>
<script src="js/paint/views.js"></script>
<script src="js/paint/paint5.js"></script>
<script src="js/modes/fragment.js"></script>
<script src="js/core/tools.js"></script>
<script src="js/paint/observations.js"></script>
<script src="js/paint/samples.js"></script>
<script src="js/core/panel.js"></script>
<script src="js/core/board2d.js"></script>
<script src="js/modes/sculpture3d.js"></script>
<script src="js/kinds/banknote.js"></script>
<script src="js/modes/memory.js"></script>
<script src="js/core/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
